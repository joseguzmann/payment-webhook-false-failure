<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment webhook demo</title>
<style>
  :root { --wa-green: #008069; --wa-bubble: #fff; --wa-mine: #d9fdd3; --bg: #f0f2f5; --ink: #111b21; --muted: #667781;
          --ok: #1a7f37; --bad: #c62828; --warn: #9a6700; --line: #e3e6ea; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); }
  .layout { display: grid; grid-template-columns: 400px 1fr; gap: 24px; max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  /* Phone */
  .phone { background: #efeae2; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,.12);
           display: flex; flex-direction: column; height: 680px; }
  .phone header { background: var(--wa-green); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: #fff3; display: grid; place-items: center; font-weight: 700; }
  .phone header small { display: block; opacity: .8; font-size: 12px; }
  #chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .bubble { max-width: 80%; width: fit-content; padding: 6px 9px 4px; border-radius: 8px; background: var(--wa-bubble);
            box-shadow: 0 1px .5px rgba(0,0,0,.13); font-size: 14.5px; line-height: 1.35; }
  .bubble.mine { align-self: flex-end; background: var(--wa-mine); }
  .meta { display: flex; justify-content: flex-end; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .src { font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-top: 4px; display: inline-block; }
  .src.agent { background: #e7f0ff; color: #1f4fa3; }
  .src.webhook { background: #fdecea; color: var(--bad); }
  .paycard { display: block; margin-top: 6px; padding: 8px 10px; border-radius: 6px; background: #f5f6f6; color: var(--wa-green);
             text-decoration: none; font-weight: 600; text-align: center; border: 1px solid var(--line); }
  .composer { display: flex; gap: 8px; padding: 10px; background: #f0f2f5; }
  .composer input { flex: 1; border: 0; border-radius: 20px; padding: 10px 14px; font-size: 14px; }
  .composer button { border: 0; border-radius: 50%; width: 40px; background: var(--wa-green); color: #fff; font-size: 16px; cursor: pointer; }
  .empty { margin: auto; color: var(--muted); font-size: 13px; text-align: center; max-width: 260px; }

  /* Behind the scenes */
  .side h1 { font-size: 20px; margin: 4px 0 4px; }
  .side p.lead { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .panel { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  td, th { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); border-top: 0; font-size: 12px; }
  code { font-family: ui-monospace, monospace; font-size: 12.5px; background: #f3f4f6; padding: 1px 5px; border-radius: 4px; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .pill.paid { background: #dafbe1; color: var(--ok); }
  .pill.failed { background: #fdecea; color: var(--bad); }
  .pill.pending, .pill.expired { background: #f3f4f6; color: #444; }
  tr.coming td { color: var(--warn); font-style: italic; }
  .muted { color: var(--muted); font-size: 13px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; }
  .toolbar button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
</style>
</head>
<body>
<div class="layout">
  <section class="phone">
    <header><div class="avatar">S</div><div>Shop assistant<small>what the customer sees on WhatsApp</small></div></header>
    <div id="chat"></div>
    <form class="composer" id="send">
      <input id="text" value="I want to pay" autocomplete="off" aria-label="Message">
      <button aria-label="Send">➤</button>
    </form>
  </section>

  <section class="side">
    <div class="toolbar"><h1>Behind the scenes</h1><button id="reset">Reset</button></div>
    <p class="lead">Ask for a payment link, open it, and choose how the gateway answers.
      Messages from the agent carry a trace; messages from the webhook do not.</p>
    <div class="panel"><h2>Gateway callbacks → what the webhook did</h2><div id="callbacks"></div></div>
    <div class="panel"><h2>Payments</h2><div id="payments"></div></div>
    <div class="panel"><h2>Email</h2><div id="emails"></div></div>
  </section>
</div>
<script>
const customer = "demo";
const gateway = `${location.protocol}//${location.hostname}:8001`;
const KEY = "demo-customer-messages";
const CODES = {"0/36": "in review", "1/3": "approved", "5/14": "expired"};

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
function save(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch {} }
const mine = load();

// Postgres returns naive UTC timestamps.
const when = iso => new Date(/[zZ]|[+-]\d\d:\d\d$/.test(iso) ? iso : iso + "Z");
const clock = iso => when(iso).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

function body(text) {
  const url = text.match(/https?:\/\/\S+/);
  if (!url) return esc(text);
  return esc(text.replace(url[0], "").replace(/:\s*$/, "")) +
    `<a class="paycard" href="${esc(url[0])}" target="_blank" rel="noopener">Open payment link</a>`;
}

async function getJSON(url, fallback) {
  try { const r = await fetch(url); return r.ok ? r.json() : fallback; } catch { return fallback; }
}

async function refresh() {
  const [outbox, payments, callbacks] = await Promise.all([
    getJSON(`/outbox?customer=${customer}`, []),
    getJSON(`/payments?customer=${customer}`, []),
    getJSON(`${gateway}/callbacks`, null),
  ]);

  const items = [...mine, ...outbox.filter(m => m.channel === "whatsapp")]
    .map(m => ({...m, t: when(m.created_at)})).sort((a, b) => a.t - b.t);
  const chat = document.getElementById("chat");
  const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 40;
  chat.innerHTML = items.length ? items.map(m => m.mine
      ? `<div class="bubble mine">${esc(m.text)}<div class="meta">${clock(m.created_at)} ✓✓</div></div>`
      : `<div class="bubble">${body(m.text)}<div class="meta">
           <span class="src ${m.source}">${m.source === "agent" ? "agent · trace " + m.trace_id : "webhook · no trace"}</span>
           ${clock(m.created_at)}</div></div>`).join("")
    : `<div class="empty">Write "I want to pay" to get a payment link.</div>`;
  if (atBottom) chat.scrollTop = chat.scrollHeight;

  document.getElementById("callbacks").innerHTML = callbacks === null
    ? `<p class="muted">Gateway not reachable at ${gateway}.</p>`
    : callbacks.length ? `<table><tr><th>Time</th><th>Payment</th><th>Callback</th><th>Webhook answer</th></tr>${
        callbacks.map(c => {
          const code = `${c.status}/${c.status_detail}`;
          const label = CODES[code] || (c.status === "failure" ? "declined" : "");
          if (!c.at) {
            const secs = Math.max(0, Math.ceil((when(c.due) - Date.now()) / 1000));
            return `<tr class="coming"><td>in ${secs} s</td><td>#${esc(c.reference)}</td>
              <td><code>${esc(code)}</code> ${label}</td><td>coming…</td></tr>`;
          }
          return `<tr><td>${clock(c.at)}</td><td>#${esc(c.reference)}</td>
            <td><code>${esc(code)}</code> ${label}</td><td><code>${esc(String(c.result ?? c.http))}</code></td></tr>`;
        }).join("")}</table>`
    : `<p class="muted">No callbacks yet.</p>`;

  document.getElementById("payments").innerHTML = payments.length
    ? `<table><tr><th>Payment</th><th>Status</th><th>Updated</th></tr>${payments.map(p =>
        `<tr><td>#${p.id} · $${(p.amount_cents / 100).toFixed(2)}</td><td><span class="pill ${p.status}">${p.status}</span></td>
         <td>${clock(p.updated_at)}</td></tr>`).join("")}</table>`
    : `<p class="muted">No payments yet.</p>`;

  const emails = outbox.filter(m => m.channel === "email");
  document.getElementById("emails").innerHTML = emails.length
    ? emails.map(m => `<div>${clock(m.created_at)} · ${esc(m.text)}</div>`).join("")
    : `<p class="muted">No emails yet.</p>`;
}

document.getElementById("send").onsubmit = async e => {
  e.preventDefault();
  const input = document.getElementById("text");
  const text = input.value.trim();
  if (!text) return;
  mine.push({mine: true, text, created_at: new Date().toISOString()});
  save(mine);
  await fetch("/chat", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({customer, text})});
  refresh();
};
document.getElementById("reset").onclick = async () => {
  mine.length = 0;
  save(mine);
  await Promise.all([fetch("/reset", {method: "POST"}), fetch(`${gateway}/callbacks/reset`, {method: "POST"}).catch(() => {})]);
  refresh();
};
refresh();
setInterval(refresh, 300);
</script>
</body>
</html>
